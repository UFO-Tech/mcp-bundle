# config/routes/ufo_mcp.yaml
#
# One import per MCP "mount" — same pattern ufo-tech/rest-bundle uses for its own
# internal/public/second mounts. Each import's "api_group" default is the MCP group;
# an entry under ufo_mcp.groups (config/packages/ufo_mcp.yaml) is optional and only
# overrides the bundle-wide settings for that group. Route names get the group
# automatically ("mcp_ufo_mcp_endpoint", "internal_ufo_mcp_endpoint", ...; see
# Ufo\McpBundle\Routing\McpRouteImport), so the same router.yaml can be imported
# once per group without "name_prefix".
ufo_mcp:
    resource: ../../vendor/ufo-tech/mcp-bundle/config/router.yaml
    prefix: /mcp
    defaults: { api_group: mcp }

