# config/routes/ufo_mcp.yaml
#
# One import per MCP "mount" — same pattern ufo-tech/rest-bundle uses for its own
# internal/public/second mounts. Each import's "api_group" default must match a key
# under ufo_mcp.groups in config/packages/ufo_mcp.yaml. "name_prefix" keeps route
# names from colliding when the same router.yaml is imported more than once.
ufo_mcp:
    resource: ../../vendor/ufo-tech/mcp-bundle/config/router.yaml
    prefix: /mcp
    defaults: { api_group: mcp }

