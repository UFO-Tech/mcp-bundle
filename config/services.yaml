parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Ufo\McpBundle\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/UfoMcpBundle.php'
            - '../src/Attribute/'
            - '../src/Services/RpcFromMcp.php'
            - '../src/ConfigService/McpGroupConfig.php'
            - '../src/I18n/TranslatedToolTextResolver.php'

    Ufo\McpBundle\ConfigService\McpConfig:
        arguments: ['%ufo_mcp.options%']

    # PSR-7/PSR-17 plumbing the MCP SDK transport needs; registered as services so
    # McpTransportFactory can take them as constructor dependencies instead of `new`.
    Nyholm\Psr7\Factory\Psr17Factory: ~
    Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory: ~
    Symfony\Bridge\PsrHttpMessage\Factory\HttpFoundationFactory: ~
